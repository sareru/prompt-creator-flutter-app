name: prompt_creator_flutter_app
description: "A Boys Love Story Prompt Creator"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_tabler_icons: ^1.43.0
  url_launcher: ^6.3.2
  date_field: ^6.0.3+1
  intl: ^0.20.2
  sqlite3: ^2.9.4
  drift: ^2.31.0
  drift_dev: ^2.31.0
  drift_flutter: ^0.2.8
  path: ^1.9.1
  path_provider: ^2.1.5
  path_provider_platform_interface: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.11.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/font/
  fonts:
  - family: Unica
    fonts:
      - asset: assets/font/UnicaOne-Regular.ttf
  - family: YuseiMagic
    fonts:
      - asset: assets/font/YuseiMagic-Regular.ttf
